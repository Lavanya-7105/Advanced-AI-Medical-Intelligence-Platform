<!DOCTYPE html>
<html>
<head>
    <title>Advanced AI Medical Intelligence Platform</title>
    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            text-align:center;
            margin-top:60px;
        }

        .box{
            width:450px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            color:#1565c0;
        }

        input{
            margin:20px;
        }

        button{
            padding:10px 25px;
            background:#1565c0;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        h3{
            color:green;
        }
    </style>
</head>

<body>

<div class="box">

<h2>Advanced AI Medical Intelligence Platform</h2>

<form method="POST" enctype="multipart/form-data">

<input type="file" name="image" required>

<br>

<button type="submit">
Predict Disease
</button>

</form>

{% if result %}

<hr>

<h3>Prediction : {{ result }}</h3>
<h3>Confidence : {{ confidence }}%</h3>
{% if image_name %}

<img src="{{ url_for('static', filename='uploads/' + image_name) }}"
     width="300">

{% endif %}

{% endif %}

</div>

</body>

</html>
