<!DOCTYPE html>
<html>

<head>

<title>Prediction History</title>

<style>

table{
width:80%;
margin:auto;
border-collapse:collapse;
}

th,td{
border:1px solid black;
padding:10px;
text-align:center;
}

h2{
text-align:center;
}

</style>

</head>

<body>

<h2>Prediction History</h2>

<table>

<tr>

<th>ID</th>
<th>Image</th>
<th>Prediction</th>
<th>Date</th>

</tr>

{% for row in predictions %}

<tr>

<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
